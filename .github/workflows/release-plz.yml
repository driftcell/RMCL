name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: Prepare release PR
    if: github.repository == 'driftcell/RMCL'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    name: Tag merged release
    if: github.repository == 'driftcell/RMCL'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Run release-plz release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Tags pushed with github.token do not trigger another workflow by push event.
      - name: Trigger release build
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(jq 'length' <<< "${RELEASES}")" == "0" ]]; then
            echo "release-plz reported a release without release metadata" >&2
            exit 1
          fi

          while IFS= read -r release_tag; do
            if [[ -z "${release_tag}" ]]; then
              echo "release-plz returned an empty release tag" >&2
              exit 1
            fi
            gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${release_tag}"
          done < <(jq -r '.[].tag // empty' <<< "${RELEASES}")
