name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.rust }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'apps/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - '.config/**'
              - '.github/scripts/**'
              - '.github/workflows/**'

  lint:
    name: Format, Clippy, and doctests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install GPUI system dependencies
        run: bash .github/scripts/install-gpui-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run doctests
        run: cargo test --workspace --doc --locked

  test:
    name: Nextest (${{ matrix.os }})
    needs: [changes, lint]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.lint.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install GPUI system dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-gpui-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests in parallel
        run: cargo nextest run --workspace --locked --profile ci --test-threads num-cpus --no-tests=fail

  ci-success:
    name: CI success
    needs: [changes, lint, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "changes=${CHANGES_RESULT}"
          echo "lint=${LINT_RESULT}"
          echo "test=${TEST_RESULT}"

          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "Detect Rust changes did not succeed." >&2
            exit 1
          fi

          for result in "${LINT_RESULT}" "${TEST_RESULT}"; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "Required Rust job did not succeed: ${result}" >&2
                exit 1
                ;;
            esac
          done
