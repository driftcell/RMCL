[workspace]
# Only the rmcl application is released. Internal crates are unpublished
# modules with a fixed version and are excluded from release-plz.
release = false
release_always = false
release_commits = "^(feat|fix|perf|refactor)"
# Keep feature releases meaningful during 0.x: 0.4.4 + feat -> 0.5.0.
features_always_increment_minor = true
git_only = false
publish = false
changelog_path = "CHANGELOG.md"
changelog_update = false
git_tag_enable = false
git_release_enable = false
semver_check = false
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]

[changelog]
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
]

[[package]]
name = "rmcl"
release = true
git_only = true
changelog_update = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
