[workspace]
members = [
    "apps/rmcl",
    "crates/rmcl-archive",
    "crates/rmcl-auth",
    "crates/rmcl-domain",
    "crates/rmcl-instance",
    "crates/rmcl-install",
    "crates/rmcl-minecraft",
    "crates/rmcl-net",
]
default-members = ["apps/rmcl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
crc32fast = "1.5"
fastrand = "2"
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
regex = "1"
relative-path = "2"
rmcl-archive = { path = "crates/rmcl-archive" }
rmcl-auth = { path = "crates/rmcl-auth" }
rmcl-domain = { path = "crates/rmcl-domain" }
rmcl-instance = { path = "crates/rmcl-instance" }
rmcl-install = { path = "crates/rmcl-install" }
rmcl-minecraft = { path = "crates/rmcl-minecraft" }
rmcl-net = { path = "crates/rmcl-net" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
