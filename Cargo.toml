[workspace]
members = ["apps/rmcl", "crates/rmcl-auth", "crates/rmcl-minecraft"]
default-members = ["apps/rmcl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
md-5 = "0.10"
regex = "1"
rmcl-auth = { path = "crates/rmcl-auth" }
rmcl-minecraft = { path = "crates/rmcl-minecraft" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = "1"
