[workspace]
members = [
    "apps/rmcl",
    "crates/rmcl-app",
    "crates/rmcl-archive",
    "crates/rmcl-auth",
    "crates/rmcl-content",
    "crates/rmcl-domain",
    "crates/rmcl-instance",
    "crates/rmcl-install",
    "crates/rmcl-java",
    "crates/rmcl-launch",
    "crates/rmcl-minecraft",
    "crates/rmcl-mcp",
    "crates/rmcl-net",
    "crates/rmcl-platform",
    "crates/rmcl-store",
]
default-members = ["apps/rmcl"]
resolver = "3"

[workspace.package]
# Internal crates are unpublished modules; only apps/rmcl carries the app version.
version = "0.1.0"
edition = "2024"
license = "MIT"

# The skin preview rasterizes on a background thread, but debug builds make
# each frame slow enough to lag behind the animation. Optimize the app crate in
# development without slowing down the rest of the workspace.
[profile.dev.package.rmcl-app]
opt-level = 2

[workspace.dependencies]
axum = "0.8"
base64 = "0.23"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
crc32fast = "1.5"
dirs = "6"
fastrand = "2"
flate2 = "1"
futures = "0.3"
gpui-kit = "0.8.1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.11"
mvn_version = "0.1"
open = "5"
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
regex = "1"
relative-path = "2"
rmcl-app = { path = "crates/rmcl-app" }
rmcl-archive = { path = "crates/rmcl-archive" }
rmcl-auth = { path = "crates/rmcl-auth" }
rmcl-content = { path = "crates/rmcl-content" }
rmcl-domain = { path = "crates/rmcl-domain" }
rmcl-instance = { path = "crates/rmcl-instance" }
rmcl-install = { path = "crates/rmcl-install" }
rmcl-java = { path = "crates/rmcl-java" }
rmcl-launch = { path = "crates/rmcl-launch" }
rmcl-minecraft = { path = "crates/rmcl-minecraft" }
rmcl-mcp = { path = "crates/rmcl-mcp" }
rmcl-net = { path = "crates/rmcl-net" }
rmcl-platform = { path = "crates/rmcl-platform" }
rmcl-store = { path = "crates/rmcl-store" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
schemars = "1.0"
sha1 = "0.11"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
which = "8"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
