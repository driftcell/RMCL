[package]
name = "rmcl"
version = "0.9.0"
edition.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
gpui-kit.workspace = true
image.workspace = true
open.workspace = true
rmcl-agent.workspace = true
rmcl-app.workspace = true
rmcl-auth.workspace = true
rmcl-domain.workspace = true
rmcl-launch.workspace = true
rmcl-mcp.workspace = true
rmcl-net.workspace = true
rmcl-platform.workspace = true
rmcl-store.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSString", "NSURL"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
