[package]
name = "rmcl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
rmcl-app.workspace = true
rmcl-auth.workspace = true
rmcl-domain.workspace = true
rmcl-launch.workspace = true
rmcl-net.workspace = true
rmcl-store.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSOpenPanel", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL"] }
